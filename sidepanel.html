<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlyphBox</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <span class="logo-icon">⊞</span>
        <span class="logo-text">GlyphBox</span>
      </div>
      <button id="themeToggle" class="icon-btn" title="Toggle dark/light mode" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
      </button>
    </header>

    <!-- Recent History -->
    <section class="recent-section" id="recentSection" aria-label="Recent items">
      <div class="recent-header">
        <span class="section-label">Recent</span>
        <button id="clearRecent" class="text-btn" title="Clear recent history">Clear</button>
      </div>
      <div id="recentItems" class="recent-items" role="list" aria-live="polite"></div>
    </section>

    <!-- Tabs -->
    <nav class="tab-bar" role="tablist" aria-label="GlyphBox features">
      <button class="tab-btn active" data-tab="converter" role="tab" aria-selected="true" aria-controls="tab-converter">
        <span class="tab-icon">Aa</span>
        <span class="tab-label">Style</span>
      </button>
      <button class="tab-btn" data-tab="search" role="tab" aria-selected="false" aria-controls="tab-search">
        <span class="tab-icon">🔍</span>
        <span class="tab-label">Search</span>
      </button>
      <button class="tab-btn" data-tab="favorites" role="tab" aria-selected="false" aria-controls="tab-favorites">
        <span class="tab-icon">★</span>
        <span class="tab-label">Favorites</span>
      </button>
    </nav>

    <!-- Tab Content -->
    <main class="tab-content">

      <!-- ── Tab 1: Style Converter ───────────────────────────── -->
      <section id="tab-converter" class="tab-panel active" role="tabpanel" aria-labelledby="">
        <div class="panel-inner">
          <div class="input-group">
            <label for="converterInput" class="input-label">Enter text to convert</label>
            <textarea
              id="converterInput"
              class="text-input"
              placeholder="Type something…"
              rows="2"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
            ></textarea>
          </div>

          <div class="style-grid" id="styleGrid" role="list" aria-label="Text style options">
            <!-- Generated by JS -->
          </div>
        </div>
      </section>

      <!-- ── Tab 2: Unicode Search ────────────────────────────── -->
      <section id="tab-search" class="tab-panel" role="tabpanel">
        <div class="panel-inner">
          <div class="input-group">
            <label for="searchInput" class="input-label">Search Unicode characters</label>
            <div class="search-wrapper">
              <span class="search-icon" aria-hidden="true">🔍</span>
              <input
                id="searchInput"
                type="search"
                class="search-input"
                placeholder="heart, arrow, math…"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
              />
              <button id="clearSearch" class="clear-btn" aria-label="Clear search" title="Clear">✕</button>
            </div>
          </div>

          <div id="searchResults" class="glyph-grid" role="list" aria-live="polite" aria-label="Search results">
            <!-- Generated by JS -->
          </div>
          <p id="searchEmpty" class="empty-msg" hidden>No results found. Try another keyword.</p>
          <p id="searchHint" class="hint-msg">Search by name or keyword — e.g. <em>heart</em>, <em>arrow</em>, <em>math</em></p>
        </div>
      </section>

      <!-- ── Tab 3: Favorites ─────────────────────────────────── -->
      <section id="tab-favorites" class="tab-panel" role="tabpanel">
        <div class="panel-inner">
          <div class="favorites-header">
            <span class="section-label">Saved Glyphs</span>
            <button id="clearFavorites" class="text-btn danger" title="Clear all favorites">Clear all</button>
          </div>
          <div id="favoritesGrid" class="glyph-grid" role="list" aria-live="polite" aria-label="Favorites"></div>
          <p id="favoritesEmpty" class="empty-msg">No favorites yet. Click ★ on any glyph to save it.</p>
        </div>
      </section>

    </main>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="unicode-data.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
